name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TwentyOneGame

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Tests
          path: TwentyOneGame/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TwentyOneGame-jar
          path: TwentyOneGame/target/TwentyOneGame.jar
